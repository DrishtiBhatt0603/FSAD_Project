# Isolated in-memory DB for tests — never touches the real ./data file DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=SchoolAdminSystemSecretKey2024VeryLongSecretForJWTSigning
app.jwt.expiration=86400000

# Mail stays simulated in tests — no real SMTP connection
app.mail.enabled=false
app.fee.bill-grace-hours=48
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=
