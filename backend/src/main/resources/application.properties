spring.datasource.url=jdbc:h2:file:./data/schooldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=SchoolAdminSystemSecretKey2024VeryLongSecretForJWTSigning
app.jwt.expiration=86400000

# Fee billing: hours a bill stays in "Bill Sent" grace before auto-moving to PENDING
app.fee.bill-grace-hours=48

# Email notifications. Password is read from the MAIL_PASSWORD env var so it never lives in the repo.
app.mail.enabled=true
app.mail.from=School Admin <schooladministration6@gmail.com>
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=schooladministration6@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mvc.cors.allowed-origins=http://localhost:5173
